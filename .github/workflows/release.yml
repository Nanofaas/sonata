name: Release

# A PyPI version can be yanked but never reused, so this only runs on a tag,
# and the tag is checked against the version the build actually produced before
# anything is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    # Two distributions ship from this repository and are released together, so
    # one tag publishes both. Each has its own trusted publisher on PyPI, and
    # both point at this workflow and this environment.
    name: Build and publish ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [sonata-engine, sonata-tasks]
    # Must match the environment registered as each project's trusted publisher
    # on PyPI, along with owner, repository and this filename.
    environment: pypi
    permissions:
      # The whole credential: PyPI trusts a short-lived OIDC token minted here,
      # so no API token is stored in the repository or in a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # One package per job, on its own runner, so dist/ holds exactly one
      # wheel and the guard below can rely on that.
      - name: Build ${{ matrix.package }}
        run: uv build --package ${{ matrix.package }} --out-dir dist

      # The check that matters: uploading 0.7.0 under the tag v0.6.0 would burn
      # the 0.7.0 version number permanently.
      - name: Check the tag matches the built version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Globs every wheel rather than "<name>-*.whl": the wheel is named
          # after the distribution, and a module-based glob matched nothing in a
          # sibling repository, failing that build before its upload could even
          # start. This no longer guesses a name.
          wheels=(dist/*.whl)
          if [ "${#wheels[@]}" -ne 1 ]; then
            echo "expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            ls -la dist/ >&2
            exit 1
          fi
          artifact="$(basename "${wheels[0]}")"
          case "$artifact" in
            *"-$tag-"*) echo "tag $GITHUB_REF_NAME matches $artifact" ;;
            *)
              echo "tag $GITHUB_REF_NAME does not match the built $artifact" >&2
              exit 1
              ;;
          esac

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
