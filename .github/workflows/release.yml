name: Release

# A PyPI version can be yanked but never reused, so this only runs on a tag,
# and the tag is checked against the version the build actually produced before
# anything is uploaded.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Two distributions ship from this repository and are released together, so
  # one tag publishes both. Each has its own trusted publisher on PyPI, and
  # both point at this workflow and this environment.
  #
  # They are two jobs rather than one matrix on purpose. `sonata-tasks` pins
  # `sonata-engine` at the same version, so an upload of tasks that survives a
  # failed upload of engine leaves a distribution on PyPI that cannot be
  # installed -- and the version number is spent. A matrix runs its legs
  # concurrently and cannot express that dependency; `needs` can.
  engine:
    name: Build and publish sonata-engine
    runs-on: ubuntu-latest
    # Must match the environment registered as each project's trusted publisher
    # on PyPI, along with owner, repository and this filename.
    environment: pypi
    permissions:
      # The whole credential: PyPI trusts a short-lived OIDC token minted here,
      # so no API token is stored in the repository or in a secret.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # One package per job, on its own runner, so dist/ holds exactly one
      # wheel and the guard below can rely on that.
      - name: Build sonata-engine
        run: uv build --package sonata-engine --out-dir dist

      - name: Check the tag matches the built version
        uses: ./.github/actions/check-release-tag

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  tasks:
    name: Build and publish sonata-tasks
    needs: engine
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build sonata-tasks
        run: uv build --package sonata-tasks --out-dir dist

      - name: Check the tag matches the built version
        uses: ./.github/actions/check-release-tag

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
