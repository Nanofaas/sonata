name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Lint, format, types, security.
  #
  # Runs the same hooks as local development through pre-commit, so the two can
  # not drift. This job is new: the checks used to be written inline in the
  # engine and catalogue jobs below, which meant a developer running
  # `uv run ruff check` locally and CI could disagree without anyone noticing.
  #
  # The workspace is synced with every extra first, because the catalogue's
  # basedpyright hook needs the optional integrations (shellcraft, proxmox-sdk,
  # azure-vm-sdk, multipass-sdk) to be importable.
  # ---------------------------------------------------------------------------
  pre-commit:
    name: pre-commit (ruff, basedpyright, bandit, import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the workspace
        run: uv sync --locked --all-packages --all-groups --all-extras

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install engine dependencies only
        run: uv sync --locked --package sonata-engine --group dev

      - name: Verify the catalogue is not installed
        run: >-
          uv run --locked --package sonata-engine python -c
          "import importlib.util; assert importlib.util.find_spec('sonata_tasks') is None"

      - name: Run engine tests
        run: uv run --locked --package sonata-engine pytest -c pyproject.toml tests

      - name: Check engine source
        run: |
          uv run --locked --package sonata-engine ruff check src tests
          uv run --locked --package sonata-engine basedpyright --project .

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install catalogue dependencies and every optional integration
        run: uv sync --locked --all-packages --all-groups --all-extras

      - name: Run task catalogue tests
        run: >-
          uv run --locked --all-packages --all-groups --all-extras pytest
          -c packages/sonata-tasks/pyproject.toml packages/sonata-tasks/tests

      - name: Check task catalogue source
        run: |
          uv run --locked --all-packages --all-groups --all-extras ruff check --config packages/sonata-tasks/pyproject.toml packages/sonata-tasks
          uv run --locked --all-packages --all-groups --all-extras basedpyright --project packages/sonata-tasks
          uv run --locked --all-packages --all-groups --all-extras lint-imports --config packages/sonata-tasks/.importlinter --no-cache

  wheel-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            extra: ""
          - name: shell
            extra: shell
          - name: prometheus
            extra: prometheus
          - name: multipass
            extra: multipass
          - name: azure
            extra: azure
          - name: proxmox
            extra: proxmox
    name: wheel (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Both distributions: the catalogue pins the engine exactly and the two are
      # released together, so installing the catalogue alone would ask an index for
      # an engine version that does not exist until this commit is released.
      - name: Build the distributions
        run: uv build --all-packages --out-dir dist

      - name: Install wheel and run independent consumer
        env:
          TASK_EXTRA: ${{ matrix.extra }}
        run: |
          args=(dist/sonata_tasks-*.whl --with dist/sonata_engine-*.whl)
          if [ -n "$TASK_EXTRA" ]; then
            args+=(--extra "$TASK_EXTRA")
          fi
          python scripts/check_task_wheel.py "${args[@]}"
